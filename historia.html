<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historia | Curruscos Clan</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .history-form {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .history-form.active {
            display: block;
        }

        .history-form input,
        .history-form textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .history-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .history-form-buttons {
            display: flex;
            gap: 10px;
        }

        .history-timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .history-timeline::before {
            content: "";
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #ddd;
        }

        .history-year {
            position: relative;
            margin-bottom: 35px;
        }

        .history-year-title {
            margin-left: 55px;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .history-entry {
            position: relative;
            margin-left: 55px;
            margin-bottom: 25px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .history-entry::before {
            content: "";
            position: absolute;
            left: -43px;
            top: 24px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            border: 3px solid #333;
        }

        .history-date {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }

        .history-entry h3 {
            margin: 0 0 10px;
        }

        .history-description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .history-meta {
            font-size: 13px;
            color: #888;
        }

        .delete-history {
            margin-top: 15px;
            border: none;
            background: #f1f1f1;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty-history {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        @media (max-width: 600px) {

            .history-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .history-timeline::before {
                left: 10px;
            }

            .history-entry,
            .history-year-title {
                margin-left: 35px;
            }

            .history-entry::before {
                left: -33px;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">

        <div class="brand">
            <a href="index.html">Curruscos Clan</a>
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="miembros.html">Miembros</a>
            <a href="eventos.html">Eventos</a>
            <a href="recuerdos.html">Recuerdos</a>
            <a href="historia.html">Historia</a>
        </nav>

    </header>


    <main class="container">

        <div class="history-header">

            <div>
                <h1>📖 Historia</h1>
                <p>
                    Los momentos que han ido construyendo
                    la historia del grupo.
                </p>
            </div>

            <button id="newHistoryButton">
                + Añadir momento
            </button>

        </div>


        <section id="historyForm" class="history-form">

            <h2>Añadir momento a la historia</h2>

            <label for="historyTitle">
                Título
            </label>

            <input
                type="text"
                id="historyTitle"
                placeholder="Ej. Nuestro primer viaje"
            >


            <label for="historyDate">
                Fecha
            </label>

            <input
                type="date"
                id="historyDate"
            >


            <label for="historyDescription">
                Descripción
            </label>

            <textarea
                id="historyDescription"
                placeholder="Cuenta qué ocurrió..."
            ></textarea>


            <div class="history-form-buttons">

                <button id="saveHistoryButton">
                    Guardar
                </button>

                <button
                    id="cancelHistoryButton"
                    type="button"
                >
                    Cancelar
                </button>

            </div>

        </section>


        <section
            id="historyTimeline"
            class="history-timeline"
        >
        </section>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/historia.js"></script>
</body>

</html>
