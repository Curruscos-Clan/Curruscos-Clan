<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evento · Curruscos</title>
<link rel="stylesheet" href="css/style.css">
<style>
.public-event-page{max-width:1000px;margin:0 auto;padding:70px 24px 100px}.public-event-shell{margin-top:30px;display:grid;grid-template-columns:minmax(0,1.5fr) 310px;gap:16px}.public-event-main,.public-event-side{padding:28px;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-sm)}.public-event-main h1{font-size:clamp(42px,7vw,72px);line-height:.94;letter-spacing:-.07em;margin:12px 0 20px}.public-event-main p{color:var(--muted);line-height:1.65}.public-event-description{white-space:pre-wrap}.public-tournament-panel{margin-top:25px;padding:20px;border:1px solid var(--border);border-radius:18px;background:var(--background)}.public-tournament-label{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:1px}.public-tournament-panel>strong{display:block;margin-top:5px}.public-tournament-panel>p{color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-wrap}.public-tournament-panel h3{font-size:16px;margin:22px 0 8px}.public-team-list,.public-match-list{display:grid;gap:6px}.public-team-row,.public-match-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:12px}.public-team-row small{color:var(--muted)}.public-match-row{align-items:center}.public-match-row strong{font-size:11px;text-align:right}.public-rounds{display:grid;gap:16px}.public-round{padding:14px;background:var(--surface);border-radius:15px;border:1px solid var(--border)}.public-round h4{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.public-match-row{align-items:center}.public-match-row>div{display:grid;gap:4px}.public-match-row>div>span{font-size:9px;color:var(--muted);text-transform:uppercase}.public-match-row>div>strong{font-size:12px}.public-match-row em{font-style:normal;color:var(--muted);font-weight:400}.public-match-row small{color:var(--muted);font-size:10px}.match-result-form{display:flex;align-items:center;gap:5px}.match-result-form input{width:48px;padding:7px;text-align:center}.match-result-form .button-small{min-height:32px;padding:0 10px;font-size:10px}.tournament-admin-box{margin-top:18px;padding:16px;border-radius:15px;background:var(--accent-soft)}.tournament-admin-box strong{font-size:13px}.tournament-admin-box p{font-size:11px!important;margin:6px 0 12px}.public-standings{display:grid;gap:5px}.public-standing-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:12px}.public-standing-row strong{font-size:12px}.public-standing-row small{color:var(--muted);font-size:9px}.tournament-winner{margin-top:18px;padding:18px;border-radius:16px;background:#111;color:#fff}.tournament-winner span{font-size:9px;letter-spacing:1px;color:#aaa}.tournament-winner strong{display:block;margin-top:5px;font-size:20px}.public-event-side{height:max-content;position:sticky;top:85px}.public-event-stat{padding:14px 0;border-bottom:1px solid var(--border)}.public-event-stat:last-of-type{border-bottom:0}.public-event-stat span{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.public-event-stat strong{display:block;margin-top:5px;font-size:16px}.public-event-side .button{width:100%;margin-top:16px}.public-login-note{font-size:12px;color:var(--muted);line-height:1.5;margin:13px 0 0}@media(max-width:800px){.public-event-shell{grid-template-columns:1fr}.public-event-side{position:static}.public-event-page{padding:45px 16px 75px}}
</style>
</head>
<body>
<header class="navbar">
<a href="index.html" class="logo">CURRUSCOS.</a>
<nav id="mainNav"><a href="explorar.html">Explorar</a><a href="mis-eventos.html">Mis eventos</a><a href="crear.html">Crear</a><a href="login.html">Entrar</a></nav>
<button id="menuButton" class="menu-button" aria-label="Menú">☰</button>
</header>
<main class="public-event-page">
<div id="publicEventRoot"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/evento-publico.js"></script>
</body>
</html>
