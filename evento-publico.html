.public-event-page{max-width:1000px;margin:0 auto;padding:70px 24px 100px}.public-event-shell{margin-top:30px;display:grid;grid-template-columns:minmax(0,1.5fr) 310px;gap:16px}.public-event-main,.public-event-side{padding:28px;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-sm)}.public-event-main h1{font-size:clamp(42px,7vw,72px);line-height:.94;letter-spacing:-.07em;margin:12px 0 20px}.public-event-main p{color:var(--muted);line-height:1.65}.public-event-description{white-space:pre-wrap}.public-tournament-panel{margin-top:25px;padding:20px;border:1px solid var(--border);border-radius:18px;background:var(--background)}.public-tournament-label{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:1px}.public-tournament-panel>strong{display:block;margin-top:5px}.public-tournament-panel>p{color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-wrap}.public-tournament-panel h3{font-size:16px;margin:22px 0 8px}.public-team-list,.public-match-list{display:grid;gap:6px}.public-team-row,.public-match-row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:12px}.public-team-row small{color:var(--muted)}.public-match-row{align-items:center}.public-match-row strong{font-size:11px;text-align:right}.public-rounds{display:grid;gap:16px}.public-round{padding:14px;background:var(--surface);border-radius:15px;border:1px solid var(--border)}.public-round h4{margin:0 0 8px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.public-match-row{align-items:center}.public-match-row>div{display:grid;gap:4px}.public-match-row>div>span{font-size:9px;color:var(--muted);text-transform:uppercase}.public-match-row>div>strong{font-size:12px}.public-match-row em{font-style:normal;color:var(--muted);font-weight:400}.public-match-row small{color:var(--muted);font-size:10px}.match-result-form{display:flex;align-items: .related-events-panel{margin-top:16px}.related-events-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:15px}.related-event-card{display:grid;gap:7px;padding:15px;border:1px solid var(--border);border-radius:16px;background:var(--background);color:inherit;text-decoration:none;transition:transform .15s ease,background .15s ease}.related-event-card:hover{transform:translateY(-2px);background:var(--surface)}.related-event-card span{font-size:9px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted)}.related-event-card strong{font-size:13px;line-height:1.2}.related-event-card small{font-size:9px;color:var(--muted)}.managed-member-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.managed-member-row a{color:inherit;text-decoration:none}.managed-member-row a:hover{text-decoration:underline}@media(max-width:760px){.related-events-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.related-events-grid{grid-template-columns:1fr}}.public-team-members{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}.public-team-members a{padding:5px 8px;border-radius:999px;background:var(--background);color:var(--text);font-size:10px;text-decoration:none;border:1px solid var(--border)}.public-team-members a:hover{background:var(--accent-soft)}.public-event-side .event-organizer-link{display:inline-block;margin-top:5px;color:var(--text);font-weight:800;text-decoration:none}.public-event-side .event-organizer-link:hover{text-decoration:underline}.public-event-description{font-size:15px}.public-event-main .public-organizer-link{color:var(--text);text-decoration:none;font-weight:800}.public-event-main .public-organizer-link:hover{text-decoration:underline}.event-primary-actions{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}.event-share-button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 13px;font-size:10px;font-weight:800;cursor:pointer}.event-shar
