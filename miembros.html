<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miembros — Curruscos Clan</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="brand-group">

            <a href="dashboard.html" class="logo">
                CURRUSCOS<span>.</span>
            </a>

            <div class="group-selector">

                <button
                    type="button"
                    id="currentGroupButton"
                    class="current-group-button"
                >
                    <span id="currentGroupName">
                        Cargando grupo...
                    </span>

                    <span class="group-selector-arrow">
                        ▾
                    </span>
                </button>

                <div
                    id="groupMenu"
                    class="group-menu"
                    hidden
                >

                    <div
                        id="groupList"
                        class="group-list"
                    ></div>

                    <div class="group-menu-divider"></div>

                    <button
                        type="button"
                        id="createGroupButton"
                        class="create-group-button"
                    >
                        ＋ Crear un grupo
                    </button>

                </div>

            </div>

        </div>


        <nav id="mainNav">
            <a href="dashboard.html">Inicio</a>
            <a href="miembros.html" class="active">Miembros</a>
            <a href="historia.html">Historia</a>
            <a href="recuerdos.html">Recuerdos</a>
            <a href="eventos.html">Eventos</a>
        </nav>


        <button id="menuButton" class="menu-button">
            ☰
        </button>

    </header>


    <main>

        <section class="page-hero">

            <div class="container">

                <span class="eyebrow">
                    EL CLAN
                </span>

                <h1>
                    Los que hacen<br>
                    que esto exista.
                </h1>

                <p id="membersSubtitle">
                    Cargando miembros...
                </p>

            </div>

        </section>


       <section class="section">

    <div class="container">

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:20px;
                margin-bottom:30px;
                flex-wrap:wrap;
            "
        >

            <h2 style="margin:0;">
                Miembros
            </h2>

            <button
                id="inviteMemberButton"
                type="button"
                style="
                    border:none;
                    background:#111;
                    color:white;
                    padding:12px 18px;
                    border-radius:10px;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                + Invitar miembro
            </button>

        </div>


        <div
            id="membersGrid"
            class="members-preview"
        ></div>

    </div>

</section>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                CURRUSCOS CLAN © 2026
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                const groupButton =
                    document.getElementById(
                        "currentGroupButton"
                    );

                const groupName =
                    document.getElementById(
                        "currentGroupName"
                    );

                const groupMenu =
                    document.getElementById(
                        "groupMenu"
                    );

                const groupList =
                    document.getElementById(
                        "groupList"
                    );

                const createGroupButton =
                    document.getElementById(
                        "createGroupButton"
                    );

                const membersGrid =
                    document.getElementById(
                        "membersGrid"
                    );

                const membersSubtitle =
                    document.getElementById(
                        "membersSubtitle"
                    );


                /* ==========================================
                   USUARIO
                ========================================== */

                const user =
                    await getCurrentUser();

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                /* ==========================================
                   GRUPO ACTUAL
                ========================================== */

                const groups =
                    await getUserGroups();

                if (!groups.length) {

                    groupName.textContent =
                        "Sin grupo";

                    membersSubtitle.textContent =
                        "Todavía no perteneces a ningún grupo.";

                    membersGrid.innerHTML = `
                        <p>
                            No tienes ningún grupo todavía.
                        </p>
                    `;

                    return;

                }


                const currentGroup =
                    await getCurrentGroup();


                if (!currentGroup) {

                    membersSubtitle.textContent =
                        "No se ha podido cargar el grupo.";

                    return;

                }


                groupName.textContent =
                    currentGroup.name;


                /* ==========================================
                   SELECTOR DE GRUPOS
                ========================================== */

                groupButton.addEventListener(
                    "click",
                    () => {

                        groupMenu.hidden =
                            !groupMenu.hidden;

                    }
                );


                groupList.innerHTML = "";


                groups.forEach(
                    group => {

                        const button =
                            document.createElement(
                                "button"
                            );

                        button.type = "button";

                        button.className =
                            "group-option";


                        if (
                            group.id ===
                            currentGroup.id
                        ) {

                            button.classList.add(
                                "active"
                            );

                        }


                        button.innerHTML = `
                            <strong>
                                ${String(
                                    group.name ?? ""
                                )}
                            </strong>

                            <span>
                                ${String(
                                    group.role ?? ""
                                )}
                            </span>
                        `;


                        button.addEventListener(
                            "click",
                            () => {

                                setCurrentGroup(
                                    group.id
                                );

                                window.location.reload();

                            }
                        );


                        groupList.appendChild(
                            button
                        );

                    }
                );


                /* ==========================================
                   CREAR GRUPO
                ========================================== */

                createGroupButton.addEventListener(
                    "click",
                    async () => {

                        const name =
                            prompt(
                                "Nombre del nuevo grupo:"
                            );


                        if (
                            !name ||
                            !name.trim()
                        ) {

                            return;

                        }


                        const description =
                            prompt(
                                "Descripción del grupo (opcional):"
                            );


                        createGroupButton.disabled =
                            true;


                        const newGroup =
                            await createGroup(
                                name.trim(),
                                description
                                    ? description.trim()
                                    : null
                            );


                        createGroupButton.disabled =
                            false;


                        if (!newGroup) {

                            alert(
                                "No se ha podido crear el grupo."
                            );

                            return;

                        }


                        setCurrentGroup(
                            newGroup.id
                        );

                        window.location.reload();

                    }
                );
/* ==========================================
   INVITAR MIEMBRO
========================================== */

const inviteMemberButton =
    document.getElementById(
        "inviteMemberButton"
    );


if (
    currentGroup.role === "owner" ||
    currentGroup.role === "admin"
) {

    inviteMemberButton.style.display =
        "block";


    inviteMemberButton.addEventListener(
        "click",
        async () => {

            const username =
                prompt(
                    "Introduce el nombre de usuario de la persona que quieres invitar:"
                );


            if (
                !username ||
                !username.trim()
            ) {
                return;
            }


            inviteMemberButton.disabled =
                true;


            const {
                data,
                error
            } = await supabaseClient.rpc(
                "invite_user_by_username",
                {
                    target_group_id:
                        currentGroup.id,

                    target_username:
                        username.trim()
                }
            );


            inviteMemberButton.disabled =
                false;


            if (error) {

                console.error(
                    "Error enviando invitación:",
                    error
                );

                alert(
                    error.message ||
                    "No se ha podido enviar la invitación."
                );

                return;

            }


            alert(
                "Invitación enviada correctamente."
            );

        }
    );

} else {

    inviteMemberButton.style.display =
        "none";

}

/* ==========================================
   OBTENER MIEMBROS DEL GRUPO
========================================== */

const {
    data: members,
    error
} = await supabaseClient.rpc(
    "get_group_members",
    {
        target_group_id: currentGroup.id
    }
);

if (error) {

    console.error(
        "Error obteniendo miembros:",
        error
    );

    membersSubtitle.textContent =
        "No se han podido cargar los miembros.";

    membersGrid.innerHTML = `
        <p>
            Error cargando los miembros.
        </p>
    `;

    return;
}

console.log(
    "MIEMBROS RECIBIDOS:",
    members
);
                /* ==========================================
                   MOSTRAR MIEMBROS
                ========================================== */

               const validMembers =
    members || [];

                membersSubtitle.textContent =
                    validMembers.length === 1
                        ? "1 persona forma parte de este grupo."
                        : `${validMembers.length} personas forman parte de este grupo.`;


                membersGrid.innerHTML = "";


                validMembers.forEach(
                    member => {



                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "member-card";


                   const displayName =
    member.display_name ||
    member.username ||
    "Usuario";


                        const role =
                            member.role === "owner"
                                ? "Propietario"
                                : member.role === "admin"
                                    ? "Administrador"
                                    : "Miembro";


                        card.innerHTML = `

                            <div class="member-avatar">
                                ${String(
                                    displayName
                                        .charAt(0)
                                        .toUpperCase()
                                )}
                            </div>

                            <div class="member-info">

                                <h3>
                                    ${String(
                                        displayName
                                    )}
                                </h3>

                            <p>
    @${String(
        member.username ||
        ""
    )}
</p>

                                <span>
                                    ${role}
                                </span>

                            </div>

                        `;


                        membersGrid.appendChild(
                            card
                        );

                    }
                );


                if (!validMembers.length) {

                    membersGrid.innerHTML = `
                        <p>
                            Este grupo todavía no tiene miembros.
                        </p>
                    `;

                }

            }
        );

    </script>

</body>
</html>
