<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tus eventos guardados en Curruscos."><title>Guardados · Curruscos</title>
<link rel="stylesheet" href="css/style.css">
<style>
.saved-page{max-width:1180px;margin:0 auto;padding:70px 20px 100px}.saved-hero{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}.saved-hero h1{margin:12px 0 10px;font-size:clamp(50px,8vw,86px);line-height:.88;letter-spacing:-.09em}.saved-hero p{max-width:650px;color:var(--muted);font-size:16px;line-height:1.55;margin:0}.saved-count{min-width:150px;padding:18px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.72);text-align:center;box-shadow:var(--shadow-sm)}.saved-count strong{display:block;font-size:34px;letter-spacing:-.06em}.saved-count span{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.saved-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:15px}.saved-search{flex:1}.saved-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.saved-card{display:flex;flex-direction:column;min-height:240px;padding:21px;border:1px solid var(--border);border-radius:23px;background:var(--surface);box-shadow:var(--shadow-sm);color:inherit;text-decoration:none;transition:.24s}.saved-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}.saved-tag{display:inline-flex;align-self:flex-start;padding:6px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.saved-card h2{margin:17px 0 8px;font-size:24px;letter-spacing:-.045em}.saved-meta{color:var(--muted);font-size:11px;line-height:1.5}.saved-bottom{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:auto;padding-top:18px}.saved-bottom small{color:var(--muted);font-size:9px}.saved-open{font-size:10px;font-weight:900;color:var(--text)}.saved-remove{border:1px solid var(--border);background:rgba(255,255,255,.72);color:var(--muted);border-radius:999px;padding:8px 11px;font:inherit;font-size:9px;font-weight:800;cursor:pointer}.saved-remove:hover{color:var(--text);background:#fff}.saved-empty{grid-column:1/-1;padding:75px 20px;border:1px dashed var(--border-strong);border-radius:25px;background:rgba(255,255,255,.54);text-align:center}.saved-empty strong{display:block;font-size:22px;letter-spacing:-.04em}.saved-empty p{max-width:460px;margin:8px auto 20px;color:var(--muted);font-size:12px;line-height:1.55}.saved-loading{grid-column:1/-1;padding:35px;text-align:center;color:var(--muted)}@media(max-width:850px){.saved-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.saved-page{padding:45px 16px 75px}.saved-hero{display:block}.saved-count{margin-top:20px;width:max-content}.saved-toolbar{display:grid}.saved-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="navbar"><a href="index.html" class="logo">CURRUSCOS.</a><nav id="mainNav"><a href="explorar.html">Explorar</a><a href="mis-eventos.html">Mis eventos</a><a href="crear.html">Crear</a><a href="guardados.html" class="active">Guardados</a><a href="login.html">Entrar</a><a href="viajes.html">Viajes</a></nav><button id="menuButton" class="menu-button" aria-label="Menú">☰</button></header>
<main class="saved-page">
<section class="saved-hero"><div><span class="eyebrow">TU COLECCIÓN</span><h1>Lo que no quieres<br><span>perder.</span></h1><p>Guarda eventos interesantes y vuelve a ellos cuando estés listo para apuntarte, compartirlos o simplemente recordar el plan.</p></div><div class="saved-count"><strong id="savedCount">0</strong><span>Eventos guardados</span></div></section>
<div class="saved-toolbar"><input id="savedSearch" class="saved-search" type="search" placeholder="Buscar en tus guardados…"></div>
<section id="savedGrid" class="saved-grid"><div class="saved-loading">Cargando tus eventos…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/app.js"></script><script src="js/guardados.js"></script>
</body></html>
