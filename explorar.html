<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explorar eventos · Curruscos</title>
<link rel="stylesheet" href="css/style.css">
<style>
.explore-page{max-width:1240px;margin:0 auto;padding:70px 24px 100px}.explore-top{display:flex;justify-content:space-between;gap:25px;align-items:flex-end}.explore-top h1{font-size:clamp(48px,7vw,78px);line-height:.92;letter-spacing:-.07em;margin:12px 0}.explore-top p{max-width:620px;color:var(--muted);font-size:17px;line-height:1.55;margin:0}.explore-actions{display:flex;gap:9px;flex-wrap:wrap}.explore-filters{display:grid;grid-template-columns:1fr 190px;gap:10px;margin:35px 0 20px}.explore-filters input,.explore-filters select{min-height:48px}.public-events-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.public-event-card{display:flex;flex-direction:column;min-height:285px;padding:22px;border:1px solid var(--border);border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm);text-decoration:none;color:var(--text);transition:.2s}.public-event-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}.public-event-category{display:inline-flex;align-self:flex-start;padding:6px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.public-event-date{margin-top:24px;color:var(--accent);font-size:12px;font-weight:800}.public-event-card h2{margin:8px 0;font-size:24px;letter-spacing:-.04em}.public-event-meta,.public-event-description{color:var(--muted);font-size:13px;line-height:1.5}.public-event-description{margin-top:10px}.public-event-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:20px}.public-event-price{font-weight:800}.public-event-spots{color:var(--muted);font-size:11px}.explore-empty{grid-column:1/-1;padding:60px 25px;border:1px dashed var(--border-strong);border-radius:24px;text-align:center;color:var(--muted)}@media(max-width:900px){.public-events-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.explore-page{padding:45px 16px 75px}.explore-top{align-items:stretch;flex-direction:column}.explore-filters{grid-template-columns:1fr}.public-events-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="navbar">
<a href="index.html" class="logo">CURRUSCOS.</a>
<nav id="mainNav"><a href="explorar.html" class="active">Explorar</a><a href="mis-eventos.html">Mis eventos</a><a href="crear.html">Crear</a><a href="login.html">Entrar</a></nav>
<button id="menuButton" class="menu-button" aria-label="Menú">☰</button>
</header>
<main class="explore-page">
<div class="explore-top"><div><span class="eyebrow">EVENTOS</span><h1>Encuentra<br>algo que hacer.</h1><p>Descubre torneos, actividades y eventos creados por otras personas y apúntate a los que te interesen.</p></div><div class="explore-actions"><a class="button button-primary" href="crear.html">＋ Crear</a></div></div>
<div class="explore-filters"><input id="eventSearch" type="search" placeholder="Buscar por nombre, lugar..."><select id="eventCategory"><option value="all">Todas las categorías</option><option value="tournament">Torneos</option><option value="sport">Deporte</option><option value="gaming">Gaming</option><option value="social">Social</option><option value="activity">Actividades</option><option value="other">Otros</option></select></div>
<div id="publicEventsGrid" class="public-events-grid"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/explorar.js"></script>
</body>
</html>
