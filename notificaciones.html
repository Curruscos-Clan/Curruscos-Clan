<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notificaciones · Curruscos</title>
<meta name="description" content="Notificaciones de Curruscos.">
<link rel="stylesheet" href="css/style.css">
<style>
.notice-page{max-width:900px;margin:auto;padding:60px 18px 90px}.notice-top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.notice-top h1{font-size:clamp(46px,7vw,76px);letter-spacing:-.075em;line-height:.9;margin:9px 0}.notice-sub{color:var(--muted);font-size:13px}.notice-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.notice-count{font-size:11px;color:var(--muted)}.notice-list{display:grid;gap:8px}.notice{display:flex;gap:14px;align-items:flex-start;padding:17px;border:1px solid var(--border);border-radius:18px;background:var(--surface);cursor:pointer;transition:.15s}.notice:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}.notice.unread{border-color:var(--text)}.notice-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}.notice.read .notice-dot{background:var(--border)}.notice-main{min-width:0;flex:1}.notice-main strong{display:block;font-size:13px}.notice-main p{margin:5px 0;color:var(--muted);font-size:12px;line-height:1.45}.notice-main small{color:var(--muted);font-size:9px}.notice-action{font-size:10px;font-weight:800;border:1px solid var(--border);padding:7px 10px;border-radius:999px;background:var(--surface)}.notice-empty{text-align:center;padding:70px 20px;border:1px dashed var(--border);border-radius:22px;color:var(--muted);font-size:12px}.notice-empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}@media(max-width:650px){.notice-page{padding:40px 12px 70px}.notice-top{align-items:flex-start;flex-direction:column}.notice-toolbar{align-items:flex-start;flex-direction:column}.notice-action{display:none}}
</style>
<style>.nav-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--text);color:var(--surface);font-size:8px;font-weight:900;line-height:1;vertical-align:middle}</style></head>
<body>
<header class="navbar"><a href="index.html" class="logo">CURRUSCOS.</a><nav id="mainNav"><a href="explorar.html">Explorar</a><a href="mis-eventos.html">Mis eventos</a><a href="rankings.html">Rankings</a><a href="crear.html">Crear</a><a href="chat.html">Chat</a><a href="notificaciones.html" class="active">Avisos</a><a href="login.html">Entrar</a></nav><button id="menuButton" class="menu-button" aria-label="Menú">☰</button></header>
<main class="notice-page">
<div class="notice-top"><div><span class="eyebrow">CENTRO DE ACTIVIDAD</span><h1>Avisos.</h1><p class="notice-sub">Invitaciones, actividad, eventos y novedades que requieren tu atención.</p></div><a class="button" href="chat.html">Abrir chat</a></div>
<div class="notice-toolbar"><span id="noticeCount" class="notice-count">Cargando…</span><button id="markAll" class="button" type="button">Marcar todo como leído</button></div>
<section id="noticeList" class="notice-list"><div class="notice-empty"><strong>Cargando…</strong>Preparando tus notificaciones.</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/notificaciones.js"></script>
</body></html>
