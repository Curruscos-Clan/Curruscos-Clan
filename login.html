<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar · Curruscos Clan</title>

    <link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ff4d2e">
<style>
.auth-brand{width:min(480px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.11em}.auth-brand a{font-size:16px;letter-spacing:-.04em;color:var(--text);text-decoration:none}.auth-brand a span{color:var(--accent)}.auth-kicker{display:block;margin-bottom:9px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.13em}.auth-trust{display:flex;justify-content:center;align-items:center;gap:7px;color:var(--muted);font-size:10px;margin-top:15px}.auth-trust span{color:#1b9b5b}.login-page{min-height:100svh!important;padding:40px 20px!important;background:radial-gradient(circle at 88% 8%,rgba(255,77,46,.14),transparent 22rem),radial-gradient(circle at 10% 90%,rgba(91,104,255,.08),transparent 20rem),var(--background)!important}.login-card{border:1px solid var(--border)!important;border-radius:28px!important;background:rgba(255,255,255,.83)!important;box-shadow:var(--shadow-lg)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.login-header h1{letter-spacing:-.075em!important}.login-card form .button-primary{background:linear-gradient(135deg,#ff5a3c,#ff3c1f)!important;border:0!important}.login-divider{color:var(--muted)}@media(max-width:600px){.auth-brand{width:100%}.auth-brand>span{display:none}}
</style></head>

<body>

    <main class="login-page">
        <div class="auth-brand"><a href="index.html">CURRUSCOS<span>.</span></a><span>EVENTOS · GRUPOS · EQUIPOS</span></div>
        <section class="login-card">

            <div class="login-header"><span class="auth-kicker">TU ESPACIO EMPIEZA AQUÍ</span>
                <span class="eyebrow">CURRUSCOS CLAN</span>

                <h1>Bienvenido al Clan.</h1>

                <p>
                    Crea tu cuenta o entra para acceder a vuestro espacio.
                </p>
            </div>

            <form id="loginForm">

                <label for="email">Correo electrónico</label>

                <input
                    type="email"
                    id="email"
                    placeholder="tu@email.com"
                    required
                >

                <label for="password">Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Entrar
                </button>

            </form>

            <div class="login-divider">
                <span>o</span>
            </div>

            <button
                id="registerButton"
                class="button button-secondary"
                type="button"
            >
                Crear cuenta
            </button>

            <div class="auth-trust"><span>◉</span> Una cuenta para todos tus planes</div><p id="loginMessage" class="login-message"></p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
<script src="js/login.js"></script>
<script src="js/pwa.js"></script></body>

</html>
