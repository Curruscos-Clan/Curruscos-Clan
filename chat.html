<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat · Curruscos</title><meta name="description" content="Chat privado para hablar con tu grupo o con participantes de un evento."><link rel="stylesheet" href="css/style.css"><style>
.chat-page{max-width:900px;margin:auto;padding:60px 18px 90px}.chat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.chat-top h1{font-size:clamp(42px,7vw,68px);letter-spacing:-.07em;margin:8px 0}.chat-sub{color:var(--muted);font-size:12px}.chat-shell{border:1px solid var(--border);border-radius:26px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}.chat-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.chat-status{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.chat-status.online{color:#18864b}.chat-messages{height:min(62vh,620px);min-height:360px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px;background:var(--background)}.chat-message{max-width:78%;padding:11px 14px;border-radius:17px;background:var(--surface);border:1px solid var(--border);align-self:flex-start}.chat-message.mine{align-self:flex-end;background:var(--text);color:var(--surface);border-color:var(--text)}.chat-author{font-size:9px;font-weight:900;color:var(--accent);margin-bottom:4px}.chat-message.mine .chat-author{color:#aaa}.chat-body{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.chat-time{font-size:8px;color:var(--muted);margin-top:5px}.chat-message.mine .chat-time{color:#aaa}.chat-form{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border);background:var(--surface)}.chat-form textarea{flex:1;resize:none;min-height:48px;max-height:130px;border:1px solid var(--border);border-radius:15px;padding:13px;font:inherit;background:var(--background);color:var(--text)}.chat-form button{min-width:95px}.chat-empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:12px}.chat-login{padding:50px;text-align:center;color:var(--muted)}@media(max-width:600px){.chat-page{padding:42px 12px 65px}.chat-messages{height:60vh;min-height:330px;padding:14px}.chat-message{max-width:88%}.chat-form{align-items:flex-end}.chat-form button{min-width:70px}.chat-head{padding:15px}.chat-top{align-items:flex-start}}
