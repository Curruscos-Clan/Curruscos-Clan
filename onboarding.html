<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear tu grupo · Curruscos</title>

    <meta
        name="description"
        content="Crea el espacio de tu grupo en Curruscos."
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            margin: 0;
            background: #f7f7f5;
            color: #111;
        }

        .onboarding-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }

        .onboarding-card {
            width: 100%;
            max-width: 520px;

            background: white;

            border: 1px solid #e5e5e2;

            border-radius: 24px;

            padding: 42px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.06);
        }

        .onboarding-eyebrow {
            display: block;

            margin-bottom: 18px;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.14em;

            color: #888;
        }

        .onboarding-card h1 {
            margin: 0;

            font-size: clamp(36px, 7vw, 52px);

            line-height: 0.98;

            letter-spacing: -0.055em;
        }

        .onboarding-intro {
            margin: 20px 0 35px;

            color: #777;

            line-height: 1.6;
        }

        .onboarding-form {
            display: flex;
            flex-direction: column;

            gap: 9px;
        }

        .onboarding-form label {
            margin-top: 10px;

            font-size: 13px;
            font-weight: 650;
        }

        .onboarding-form input,
        .onboarding-form textarea {
            width: 100%;
            box-sizing: border-box;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 12px;

            background: #fafafa;

            font: inherit;

            outline: none;
        }

        .onboarding-form textarea {
            min-height: 100px;

            resize: vertical;
        }

        .onboarding-form input:focus,
        .onboarding-form textarea:focus {
            border-color: #999;

            background: white;
        }

        .onboarding-button {
            margin-top: 18px;

            width: 100%;

            border: 0;

            border-radius: 999px;

            padding: 14px 20px;

            background: #111;

            color: white;

            font: inherit;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .onboarding-button:hover {
            transform: translateY(-1px);
        }

        .onboarding-button:disabled {
            opacity: 0.6;

            cursor: wait;

            transform: none;
        }

        .onboarding-message {
            min-height: 20px;

            margin: 16px 0 0;

            text-align: center;

            color: #777;

            font-size: 14px;
        }

        .onboarding-note {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eee;

            color: #999;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }

        @media (max-width: 600px) {

            .onboarding-card {
                padding: 30px 22px;

                border-radius: 20px;
            }

        }

    </style>

<style>
.onboarding-page{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 12%,rgba(255,77,46,.13),transparent 22rem),radial-gradient(circle at 10% 88%,rgba(90,105,255,.08),transparent 19rem),var(--background)!important}.onboarding-page::before{content:"CURRUSCOS.";position:absolute;right:-30px;bottom:5%;font-size:clamp(80px,16vw,210px);font-weight:950;letter-spacing:-.11em;color:rgba(17,19,24,.025);pointer-events:none}.onboarding-card{position:relative;z-index:2;max-width:560px!important;border:1px solid var(--border)!important;border-radius:30px!important;background:rgba(255,255,255,.84)!important;box-shadow:var(--shadow-lg)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.onboarding-eyebrow{color:var(--accent)!important;font-weight:900}.onboarding-card h1{letter-spacing:-.085em!important}.onboarding-intro{font-size:15px}.onboarding-form input:focus,.onboarding-form textarea:focus{border-color:rgba(255,77,46,.55)!important;box-shadow:0 0 0 4px rgba(255,77,46,.10)!important}.onboarding-button{background:linear-gradient(135deg,#ff5a3c,#ff3c1f)!important;box-shadow:0 12px 28px rgba(255,77,46,.18)}.onboarding-note{border-top-color:var(--border)!important}@media(max-width:600px){.onboarding-page{padding:20px 14px!important}.onboarding-card{padding:27px 20px!important;border-radius:24px!important}}
</style><script src="js/i18n.js"></script>
</head>


<body>

<main class="onboarding-page">

    <section class="onboarding-card">

        <span class="onboarding-eyebrow">
            BIENVENIDO A CURRUSCOS
        </span>

        <h1>
            Crea vuestro espacio.
        </h1>

        <p class="onboarding-intro">
            Ponle un nombre a vuestro grupo y empezad a
            organizar eventos, compartir recuerdos y
            construir vuestra historia.
        </p>


        <form
            id="createGroupForm"
            class="onboarding-form"
        >

            <label for="groupName" data-i18n="group.name">
                Nombre del grupo
            </label>

            <input
                type="text"
                id="groupName"
                data-i18n-placeholder="group.namePlaceholder" placeholder="Ej. Curruscos Clan"
                maxlength="80"
                required
            >


            <label for="groupDescription" data-i18n="group.description">
                Descripción
            </label>

            <textarea
                id="groupDescription"
                data-i18n-placeholder="group.descriptionPlaceholder" placeholder="¿Qué tipo de grupo sois?"
                maxlength="300"
            ></textarea>


            <button
                type="submit"
                id="createGroupButton"
                class="onboarding-button"
            >
                Crear mi grupo
            </button>

        </form>


        <p
            id="onboardingMessage"
            class="onboarding-message"
        ></p>


        <p class="onboarding-note">
            Serás automáticamente el propietario del grupo
            y podrás invitar a otras personas.
        </p>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/pwa.js"></script></body>


</html>
