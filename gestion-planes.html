<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gestión de planes — Curruscos</title>
<link rel="stylesheet" href="css/style.css">
<style>
body{background:#f7f7f7;color:#111}.admin-page{max-width:900px;margin:0 auto;padding:60px 20px 90px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:2px;color:#888}.admin-page h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:10px 0}.lead{max-width:650px;color:#777;line-height:1.6}.panel{margin-top:32px;background:#111;color:#fff;border-radius:24px;padding:24px}.panel h2{margin:0 0 6px}.panel p{color:#aaa;font-size:13px}.row{background:#1b1b1b;border:1px solid #303030;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:10px}.meta{display:grid;gap:5px}.meta small{color:#999}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.approve{background:#fff;color:#111}.reject{background:#333;color:#fff}.status{margin-top:18px;padding:14px;border-radius:14px;background:#fff;border:1px solid #e5e5e5;display:none;font-size:13px}.empty{color:#999;font-size:13px;padding:15px 0}@media(max-width:600px){.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style>
</head>
<body>
<header class="navbar"><a class="logo" href="dashboard.html">CURRUSCOS</a></header>
<main class="admin-page">
<span class="eyebrow">GESTIÓN DEL WORKSPACE</span>
<h1>Solicitudes de plan.</h1>
<p class="lead">Revisa y gestiona las solicitudes del workspace. Solo propietarios y administradores pueden aprobar o rechazar cambios.</p>
<section class="panel">
<h2 id="panelTitle">Solicitudes</h2>
<p id="panelDescription">Cargando…</p>
<div id="requestList"></div>
</section>
<div class="status" id="status"></div>
<a href="planes.html" style="display:inline-block;margin-top:24px;color:#555;font-size:12px">← Volver a planes</a>
</main>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script>
(async()=>{
 const access=await window.curruscosReady;
 if(!access)return;
 const manager=access.currentGroup.role==="owner"||access.currentGroup.role==="admin";
 const list=document.getElementById("requestList"),desc=document.getElementById("panelDescription"),status=document.getElementById("status");
 if(!manager){desc.textContent="No tienes permisos para gestionar solicitudes.";list.innerHTML='<div class="empty">Solo el propietario o un administrador pueden acceder a esta sección.</div>';return;}
 async function load(){
   const rows=await getWorkspacePlanRequests(access.currentGroup.id);
   if(!rows.length){list.innerHTML='<div class="empty">No hay solicitudes todavía.</div>';return;}
   list.innerHTML=rows.map(r=>{
     const label=r.requested_plan==="pro"?"Pro":"Organization";
     const state=r.status==="pending"?"Pendiente":r.status==="approved"?"Aprobada":r.status==="rejected"?"Rechazada":"Cancelada";
     const date=new Date(r.created_at).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"});
     const buttons=r.status==="pending" ? '<button class="approve" data-id="'+r.id+'" data-decision="approved">Aprobar</button><button class="reject" data-id="'+r.id+'" data-decision="rejected">Rechazar</button>' : "";
     return '<div class="row"><div class="meta"><strong>'+label+' · '+state+'</strong><small>'+date+'</small></div><div class="actions">'+buttons+'</div></div>';
   }).join("");
   list.querySelectorAll("[data-decision]").forEach(btn=>btn.addEventListener("click",async()=>{
     btn.disabled=true;
     try{
       await reviewWorkspacePlanRequest(btn.dataset.id,btn.dataset.decision);
       status.style.display="block";
       status.textContent=btn.dataset.decision==="approved"?"Solicitud aprobada y plan actualizado.":"Solicitud rechazada.";
       await load();
     }catch(e){
       status.style.display="block";status.textContent=e.message||"No se ha podido gestionar la solicitud.";btn.disabled=false;
     }
   }));
 }
 await load();
})();
</script>
</body>
</html>
