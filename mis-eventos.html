<!DOCTYPE html><html lang="es" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mis planes · Curruscos</title><link rel="stylesheet" href="css/style.css"><style>
.my-events-page{max-width:1120px;margin:0 auto;padding:44px 20px 110px}
.my-events-header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}.my-events-header h1{font-size:clamp(46px,7vw,78px);line-height:.9;letter-spacing:-.07em;margin:10px 0}.my-events-header p{color:var(--muted);font-size:14px;line-height:1.55;max-width:620px;margin:0}.my-header-actions{display:flex;gap:8px}.my-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;font-size:11px;font-weight:850}.my-button.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.my-activity-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:30px}.activity-stat{padding:16px 17px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}.activity-stat span{display:block;color:var(--muted);font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:1px}.activity-stat strong{display:block;margin-top:5px;font-size:26px;letter-spacing:-.05em}
.my-events-section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:12px}.section-head h2{font-size:27px;letter-spacing:-.045em;margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.my-events-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.my-event-card{display:flex;flex-direction:column;min-height:145px;padding:19px;border:1px solid var(--border);border-radius:20px;background:var(--surface);color:var(--text);text-decoration:none;box-shadow:var(--shadow-sm);transition:.18s}.my-event-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}.my-event-card small{color:var(--accent);font-weight:900;text-transform:uppercase;letter-spacing:.9px;font-size:8px}.my-event-card h3{margin:9px 0 6px;font-size:19px;letter-spacing:-.03em}.my-event-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.my-event-card .card-bottom{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:auto;padding-top:16px}.event-status{font-size:9px;font-weight:850;padding:6px 8px;border-radius:999px;background:var(--background);color:var(--muted)}.card-action{font-size:10px;font-weight:850}.my-empty,.my-events-loading{padding:25px;border:1px dashed var(--border-strong);border-radius:18px;color:var(--muted);font-size:12px;line-height:1.5}.my-empty a{color:var(--text);font-weight:850}
@media(max-width:850px){.my-events-grid{grid-template-columns:repeat(2,1fr)}.my-activity-summary{grid-template-columns:repeat(2,1fr)}.my-events-header{align-items:start;flex-direction:column}.my-header-actions{width:100%}}
@media(max-width:600px){.my-events-page{padding:27px 14px 100px}.my-events-grid,.my-activity-summary{grid-template-columns:1fr}.my-events-header h1{font-size:55px}.my-header-actions{display:grid;grid-template-columns:1fr 1fr}.my-button{width:100%}.section-head{align-items:start;flex-direction:column}}
</style><style>.nav-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--text);color:var(--surface);font-size:8px;font-weight:900;line-height:1;vertical-align:middle}</style><script src="js/i18n.js"></script>
