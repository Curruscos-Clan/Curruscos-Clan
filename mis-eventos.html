<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mis eventos · Curruscos</title><link rel="stylesheet" href="css/style.css"><style>.my-events-page{max-width:1100px;margin:0 auto;padding:70px 24px 100px}.my-events-header{margin-bottom:35px}.my-events-header h1{font-size:clamp(48px,7vw,78px);line-height:.92;letter-spacing:-.07em;margin:12px 0}.my-events-header p{color:var(--muted);font-size:17px;line-height:1.55;max-width:650px}.my-events-section{margin-top:35px}.my-events-section h2{font-size:28px;letter-spacing:-.045em}.my-events-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.my-event-card{display:block;padding:21px;border:1px solid var(--border);border-radius:21px;background:var(--surface);color:var(--text);text-decoration:none;box-shadow:var(--shadow-sm)}.my-event-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}.my-event-card small{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:9px}.my-event-card h3{margin:10px 0 7px;font-size:20px}.my-event-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.my-empty{padding:35px;border:1px dashed var(--border-strong);border-radius:20px;color:var(--muted)}@media(max-width:850px){.my-events-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.my-events-page{padding:45px 16px 75px}.my-events-grid{grid-template-columns:1fr}}</style></head><body><header class="navbar"><a href="index.html" class="logo">CURRUSCOS.</a><nav id="mainNav"><a href="explorar.html">Explorar</a><a href="mis-eventos.html" class="active">Mis eventos</a><a href="crear.html">Crear</a><a href="login.html">Entrar</a></nav><button id="menuButton" class="menu-button">☰</button></header><main class="my-events-page"><div class="my-events-header"><span class="eyebrow">TU ACTIVIDAD</span><h1>Mis eventos.</h1><p>Aquí quedan juntos los eventos a los que te has apuntado y los que organizas.</p></div><section class="my-events-section"><h2>Participo</h2><div id="participatingEvents" class="my-events-grid"></div></section><section class="my-events-section"><h2>Organizo</h2><div id="organizingEvents" class="my-events-grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/mis-eventos.js"></script></body></html>
