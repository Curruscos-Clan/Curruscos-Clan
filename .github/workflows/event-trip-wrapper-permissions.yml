name: Event and trip wrapper permission tests

on:
  push:
    branches: [fix/event-trip-wrapper-permissions]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/event-trip-wrapper-permissions.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/event-trip-wrapper-permissions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run isolated permission regression test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file supabase/tests/event_trip_wrapper_permissions_postgres.sql
