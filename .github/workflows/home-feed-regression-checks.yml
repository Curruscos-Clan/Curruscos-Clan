name: Home feed regression checks

on:
  pull_request:
    paths:
      - "index.html"
      - "css/home-redesign.css"
      - "css/home-dark-bento.css"
      - "js/explorar.js"
      - "tests/test_home_feed_event_filter.py"
      - ".github/workflows/home-feed-regression-checks.yml"
  push:
    paths:
      - "index.html"
      - "js/explorar.js"
      - "tests/test_home_feed_event_filter.py"
      - ".github/workflows/home-feed-regression-checks.yml"

permissions:
  contents: read

jobs:
  home-feed-static-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check home and Explore recommendation fields
        run: python -m unittest discover -s tests -p 'test_home_feed_event_filter.py'
      - name: Check Explore JavaScript syntax
        run: node --check js/explorar.js
