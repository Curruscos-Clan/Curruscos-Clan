name: Home feed regression checks

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/test_home_feed_event_filter.py"
      - ".github/workflows/home-feed-regression-checks.yml"
  push:
    paths:
      - "index.html"
      - "tests/test_home_feed_event_filter.py"
      - ".github/workflows/home-feed-regression-checks.yml"

permissions:
  contents: read

jobs:
  home-feed-static-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check home feed event filtering
        run: python -m unittest tests/test_home_feed_event_filter.py
