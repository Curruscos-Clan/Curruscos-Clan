<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Consulta los planes a los que te has apuntado y los que has publicado.">
  <title>Mis planes · Curruscos</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .plans-intro{margin:22px 0 24px}
    .plans-intro .eyebrow{color:var(--color-primary);font-size:.7rem;font-weight:850;letter-spacing:.12em}
    .plans-intro h1{margin:8px 0;font-size:clamp(2rem,7vw,2.8rem);line-height:1.05;letter-spacing:-.06em}
    .plans-intro p{max-width:540px;margin:0;color:var(--text-muted);font-size:.92rem}
    .plans-tabs{display:flex;border-bottom:1px solid var(--border-light);margin-bottom:18px}
    .plans-tab{flex:1;padding:12px 8px;border:0;border-bottom:2px solid transparent;background:none;color:var(--text-muted);font-size:.92rem;font-weight:750;cursor:pointer}
    .plans-tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}
    .plans-list{display:grid;gap:12px}
    .plan-card{padding:17px;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
    .plan-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .plan-card-title{margin:0;font-size:1.05rem;line-height:1.3;font-weight:800;overflow-wrap:anywhere}
    .plan-card-meta{display:grid;gap:5px;margin-top:11px;color:var(--text-muted);font-size:.83rem}
    .plan-card-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px;padding-top:12px;border-top:1px solid var(--border-light)}
    .plan-status{display:inline-flex;align-items:center;min-height:25px;padding:4px 9px;border-radius:999px;background:var(--color-primary-subtle);color:var(--color-primary);font-size:.72rem;font-weight:800}
    .plan-action{min-height:36px;padding:7px 12px;border:1px solid var(--border-light);border-radius:var(--radius-full);background:#fff;color:var(--text-main);font-size:.78rem;font-weight:750;cursor:pointer}
    .plan-action.danger{color:#b42318}
    .plan-action:disabled{opacity:.55;cursor:wait}
    .plans-state{padding:35px 18px;text-align:center;background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius-lg)}
    .plans-state h2{margin:0 0 8px;font-size:1.1rem}
    .plans-state p{margin:0 auto 16px;max-width:420px;color:var(--text-muted);font-size:.88rem}
    .plans-error{color:#b42318!important}
    .plans-secondary-link{display:inline-block;margin:18px 0 0;color:var(--text-muted);font-size:.8rem;text-decoration:underline;text-underline-offset:3px}
    @media(min-width:700px){.plans-intro{margin-top:36px}.plans-list{gap:14px}.plan-card{padding:20px}}
    :root {
      --color-primary: #f2553b;
      --color-primary-hover: #e6472d;
      --color-primary-subtle: rgba(242, 85, 59, .09);
      --border-focus: #f2553b;
    }
    .btn-primary {
      box-shadow: 0 2px 8px rgba(242, 85, 59, .22);
    }
    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 4px 14px rgba(242, 85, 59, .28);
    }
    main.app-container {
      padding-bottom: 112px !important;
    }
    .bottom-nav {
      position: fixed !important;
      z-index: 120 !important;
      left: 50% !important;
      right: auto !important;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px)) !important;
      transform: translateX(-50%) !important;
      width: min(calc(100% - 24px), 460px) !important;
      height: 64px !important;
      padding: 5px !important;
      border: 1px solid rgba(20, 20, 10, .08) !important;
      border-radius: 999px !important;
      background: rgba(255, 255, 255, .94) !important;
      box-shadow: 0 8px 32px rgba(20, 20, 10, .12) !important;
      backdrop-filter: blur(18px) !important;
      -webkit-backdrop-filter: blur(18px) !important;
    }
    .nav-tab {
      border-radius: 999px;
    }
    .nav-tab.active {
      color: var(--color-primary);
      background: var(--color-primary-subtle);
    }
  </style>
</head>
<body>
  <header class="top-header">
    <a class="app-brand" href="index.html" aria-label="Curruscos, inicio">Curruscos</a>
    <a href="perfil.html" class="btn btn-secondary" style="padding:6px 14px;font-size:.85rem">Mi perfil</a>
  </header>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <main class="app-container">
    <section class="plans-intro" aria-labelledby="plans-title">
      <span class="eyebrow">TU ACTIVIDAD</span>
      <h1 id="plans-title">Mis planes<span aria-hidden="true">.</span></h1>
      <p>Ten a mano las actividades a las que te has apuntado y las que organizas.</p>
    </section>
    <div class="plans-tabs" role="tablist" aria-label="Tipo de planes">
      <button type="button" class="plans-tab active" id="tab-attending" role="tab" aria-selected="true" aria-controls="plans-content" data-tab="attending">Voy a ir</button>
      <button type="button" class="plans-tab" id="tab-organizing" role="tab" aria-selected="false" aria-controls="plans-content" data-tab="organizing">Organizo</button>
    </div>
    <section id="plans-content" class="plans-list" role="tabpanel" aria-labelledby="tab-attending" aria-busy="true">
      <div class="plans-state"><p>Cargando tus planes…</p></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="Navegación principal">
  <a href="index.html" class="nav-tab"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-6h6v6"/></svg><span>Inicio</span></a>
  <a href="explorar.html" class="nav-tab"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span>Buscar</span></a>
  <a href="mis-planes.html" class="nav-tab"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Mis planes</span></a>
  <a href="perfil.html" class="nav-tab"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Mi perfil</span></a>
</nav>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/mis-planes.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
