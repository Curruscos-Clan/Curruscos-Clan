<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis equipos · Curruscos</title>
<meta name="description" content="Gestiona tus equipos, miembros y participaciones en Curruscos.">
<link rel="stylesheet" href="css/style.css">
<style>
.teams-page{max-width:1080px;margin:0 auto;padding:70px 24px 110px}
.teams-head{display:flex;justify-content:space-between;align-items:flex-end;gap:28px}
.teams-head h1{font-size:clamp(48px,8vw,84px);line-height:.9;letter-spacing:-.075em;margin:12px 0}
.teams-head p{max-width:650px;color:var(--muted);line-height:1.6;margin:0}
.teams-create{margin-top:30px;padding:20px;border:1px solid var(--border);border-radius:24px;background:var(--surface);display:grid;grid-template-columns:1.2fr 1.6fr auto;gap:10px;box-shadow:var(--shadow-sm)}
.teams-create input{min-width:0}
.teams-message{min-height:22px;margin:14px 2px;color:var(--muted);font-size:12px}
.teams-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:20px}
.team-card{border:1px solid var(--border);border-radius:26px;background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden}
.team-main{padding:25px 25px 21px}
.team-kicker{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.team-card h2{margin:8px 0;font-size:30px;letter-spacing:-.05em}
.team-desc{color:var(--muted);line-height:1.55;margin:0;max-width:720px}
.team-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.team-pill{border:1px solid var(--border);background:var(--background);border-radius:999px;padding:7px 10px;font-size:10px;color:var(--muted);font-weight:800}
.team-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.team-manage{display:none;border-top:1px solid var(--border);padding:22px 25px;background:var(--background)}
.team-manage.open{display:block}
.manage-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}
.manage-section h3{margin:0 0 12px;font-size:18px;letter-spacing:-.03em}
.members-list{display:grid;gap:8px}
.member-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:15px;background:var(--surface)}
.member-left{display:flex;align-items:center;min-width:0;gap:10px}
.member-avatar{width:35px;height:35px;border-radius:11px;background:var(--text);color:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
.member-copy{min-width:0}
.member-copy strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member-copy small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.invite-box{padding:15px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}
.invite-box input{width:100%}
.people-results{display:grid;gap:6px;margin-top:8px}
.person-result{width:100%;text-align:left;border:1px solid var(--border);background:var(--background);border-radius:12px;padding:10px 11px;cursor:pointer;color:inherit}
.person-result:hover,.person-result.selected{background:var(--surface)}
.person-result strong{font-size:11px}.person-result small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.invite-status{min-height:17px;margin-top:8px;color:var(--muted);font-size:10px}
.event-list{display:grid;gap:7px}
.event-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--surface);text-decoration:none;color:inherit}
.event-row:hover{transform:translateY(-1px)}
.event-copy{min-width:0}.event-copy strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-copy small{display:block;color:var(--muted);font-size:9px;margin-top:4px}
.event-date{color:var(--muted);font-size:9px;text-align:right;white-space:nowrap}
.manage-empty{padding:25px 10px;color:var(--muted);font-size:11px;text-align:center;border:1px dashed var(--border);border-radius:15px}
.danger{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
@media(max-width:800px){.teams-create{grid-template-columns:1fr}.manage-grid{grid-template-columns:1fr}}
@media(max-width:650px){.teams-page{padding:48px 17px 80px}.teams-head{display:block}.team-main,.team-manage{padding:21px}.team-actions .button{flex:1}.event-row{align-items:flex-start}}
.nav-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--text);color:var(--surface);font-size:8px;font-weight:900;line-height:1;vertical-align:middle}
</style>
<script src="js/i18n.js"></script>
</head>
<body>
<header class="navbar"><a href="index.html" class="logo">CURRUSCOS.</a><nav id="mainNav"><a href="explorar.html">Explorar</a><a href="mis-eventos.html">Mis eventos</a><a href="rankings.html">Rankings</a><a href="crear.html">Crear</a><a href="login.html">Entrar</a><a href="guardados.html">Guardados</a><a href="viajes.html">Viajes</a></nav><button id="menuButton" class="menu-button" aria-label="Menú">☰</button></header>
<main class="teams-page">
<span class="eyebrow">COMUNIDAD</span>
<div class="teams-head"><div><h1>Mis equipos.</h1><p>Construye identidades persistentes que puedan competir contigo en distintos eventos. Los miembros, la actividad y el historial acompañan al equipo.</p></div></div>
<form id="teamCreateForm" class="teams-create"><input id="teamName" maxlength="80" placeholder="Nombre del equipo" required><input id="teamDescription" maxlength="300" placeholder="Descripción (opcional)"><button class="button button-primary" type="submit">Crear equipo</button></form>
<p id="teamsMessage" class="teams-message"></p>
<section id="teamsGrid" class="teams-grid"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  init();
});

async function init() {
  var grid = document.getElementById("teamsGrid");
  var message = document.getElementById("teamsMessage");
  var form = document.getElementById("teamCreateForm");
  var user = await getCurrentUser();

  if (!user) {
    message.innerHTML = 'Necesitas iniciar sesión para gestionar equipos. <a href="login.html">Entrar</a>';
    form.style.display = "none";
    return;
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (m) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];
    });
  }

  function activityLabel(value) {
    var labels = {padel:"Pádel",futbol:"Fútbol",baloncesto:"Baloncesto",tenis:"Tenis",ajedrez:"Ajedrez",gaming:"Gaming",running:"Running",otro:"Otro"};
    return labels[value] || "Actividad";
  }

  function formatDate(dateValue, timeValue) {
    if (!dateValue) return "";
    var value = dateValue + "T" + (timeValue || "00:00");
    return new Date(value).toLocaleDateString("es-ES", {day:"numeric", month:"short", year:"numeric"});
  }

  function memberMarkup(member, teamId) {
    var name = member.display_name || member.username || "Usuario";
    var userId = member.user_id || member.id || "";
    var suffix = member.username ? "@" + esc(member.username) : "Perfil público";
    var action = "";
    if (member.role === "owner") {
      action = "";
    } else if (userId === user.id) {
      action = '<button type="button" class="button button-small leave-team danger" data-team="' + esc(teamId) + '">Salir</button>';
    } else {
      action = '<button type="button" class="button button-small remove-member danger" data-team="' + esc(teamId) + '" data-user="' + esc(userId) + '">Quitar</button>';
    }
    return '<div class="member-row"><div class="member-left"><span class="member-avatar">' +
      esc(name.charAt(0).toUpperCase()) + '</span><span class="member-copy"><strong>' +
      esc(name) + '</strong><small>' + (member.role === "owner" ? "Propietario · " : "") +
      suffix + '</small></span></div>' + action + '</div>';
  }
  function pendingMarkup(item) {
    var name = item.invitee_name || item.invitee_username || "Usuario";
    return '<div class="member-row"><div class="member-left"><span class="member-avatar">' +
      esc(name.charAt(0).toUpperCase()) + '</span><span class="member-copy"><strong>' +
      esc(name) + '</strong><small>' + (item.invitee_username ? "@" + esc(item.invitee_username) + " · " : "") +
      'pendiente</small></span></div><button type="button" class="button button-small cancel-invite danger" data-invite="' +
      esc(item.invitation_id) + '">Cancelar</button></div>';
  }

  function eventMarkup(item) {
    return '<a class="event-row" href="evento-publico.html?id=' + encodeURIComponent(item.event_id) +
      '"><span class="event-copy"><strong>' + esc(item.title) + '</strong><small>' +
      esc(activityLabel(item.event_type)) + (item.location ? " · " + esc(item.location) : "") +
      '</small></span><span class="event-date">' + esc(formatDate(item.event_date, item.event_time)) +
      '</span></a>';
  }

  function renderTeam(data) {
    var team = data.team;
    var owner = team.role === "owner";
    var members = data.members || [];
    var pending = data.pending || [];
    var events = data.events || [];

    var card = document.createElement("article");
    card.className = "team-card";
    card.dataset.team = team.team_id;

    var meta = '<span class="team-pill">' + Number(team.member_count || 0) + ' miembros</span>' +
      '<span class="team-pill">' + events.length + ' eventos públicos</span>';
    if (owner && pending.length) {
      meta += '<span class="team-pill">' + pending.length + ' invitación' +
        (pending.length === 1 ? "" : "es") + ' pendiente' + (pending.length === 1 ? "" : "s") + '</span>';
    }

    var memberHtml = members.map(function (member) { return memberMarkup(member, team.team_id); }).join("");
    if (!memberHtml) memberHtml = '<div class="manage-empty">Aún no hay miembros.</div>';

    var pendingHtml = pending.map(pendingMarkup).join("");
    if (!pendingHtml) pendingHtml = '<div class="manage-empty">No hay invitaciones pendientes.</div>';

    var eventHtml = events.map(eventMarkup).join("");
    if (!eventHtml) eventHtml = '<div class="manage-empty">Todavía no hay participaciones públicas.</div>';

    var actions = '<a class="button button-small" href="equipo-publico.html?id=' + encodeURIComponent(team.team_id) +
      '">Ver equipo</a><a class="button button-small" href="chat.html?team=' + encodeURIComponent(team.team_id) +
      '">Chat</a>';
    if (owner) {
      actions += '<button type="button" class="button button-primary button-small manage-team">Gestionar</button>';
    }

    var manage = "";
    if (owner) {
      manage = '<div class="team-manage"><div class="manage-grid">' +
        '<section class="manage-section" style="margin-bottom:20px"><h3>Identidad</h3><form class="team-edit-form"><div style="display:grid;grid-template-columns:1.2fr 2fr auto;gap:8px"><input class="edit-team-name" maxlength="80" value="'+esc(team.name)+'" required><input class="edit-team-description" maxlength="300" value="'+esc(team.description||"")+'" placeholder="Descripción (opcional)"><button class="button button-small" type="submit">Guardar</button></div><div class="invite-status edit-team-status"></div></form></section>' +
        '<section class="manage-section"><h3>Plantilla</h3><div class="members-list">' + memberHtml + '</div></section>' +
        '<section class="manage-section"><h3>Invitar personas</h3><div class="invite-box">' +
        '<input class="person-search" placeholder="Busca por nombre o @usuario..." autocomplete="off">' +
        '<div class="people-results"></div><div class="invite-status"></div></div>' +
        '<div style="margin-top:14px"><h3>Invitaciones pendientes</h3><div class="members-list">' +
        pendingHtml + '</div></div></section></div>' +
        '<section class="manage-section" style="margin-top:20px"><h3>Actividad pública</h3><div class="event-list">' +
        eventHtml + '</div></section></div>';
    }

    card.innerHTML = '<div class="team-main"><span class="team-kicker">' +
      (owner ? "PROPIETARIO" : "MIEMBRO") + ' · EQUIPO PERSISTENTE</span><h2>' + esc(team.name) +
      '</h2><p class="team-desc">' + esc(team.description || "Sin descripción.") +
      '</p><div class="team-meta">' + meta + '</div><div class="team-actions">' + actions +
      '</div></div>' + manage;

    return card;
  }

  async function load() {
    grid.innerHTML = '<article class="team-card"><div class="team-main"><p class="team-desc">Cargando tus equipos…</p></div></article>';
    var teams = await getMyTeams();

    if (!teams.length) {
      grid.innerHTML = '<article class="team-card"><div class="team-main"><h2>Aún no tienes equipos.</h2>' +
        '<p class="team-desc">Crea el primero y podrás reutilizarlo en tus próximos eventos.</p></div></article>';
      return;
    }

    var data = await Promise.all(teams.map(async function (team) {
      var members = await getPersistentTeamMembers(team.team_id);
      var events = await getPublicPersistentTeamEvents(team.team_id);
      var pending = team.role === "owner" ? await getPersistentTeamPendingInvitations(team.team_id) : [];
      return {team:team, members:members || [], events:events || [], pending:pending || []};
    }));

    grid.replaceChildren();
    data.forEach(function (item) { grid.appendChild(renderTeam(item)); });
    window.teamManagementData = data;
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    var button = event.submitter;
    button.disabled = true;
    message.textContent = "Creando equipo…";
    try {
      var id = await createPersistentTeam(
        document.getElementById("teamName").value,
        document.getElementById("teamDescription").value
      );
      if (!id) throw new Error("No se ha podido crear el equipo.");
      form.reset();
      message.textContent = "Equipo creado.";
      await load();
    } catch (error) {
      message.textContent = error.message || "No se ha podido crear el equipo.";
    } finally {
      button.disabled = false;
    }
  });

  var searchTimer = null;

  grid.addEventListener("click", async function (event) {
    var manage = event.target.closest(".manage-team");
    if (manage) {
      var panel = manage.closest(".team-card").querySelector(".team-manage");
      if (panel) panel.classList.toggle("open");
      return;
    }

    var leave = event.target.closest(".leave-team");
   if (leave) {
     if (!confirm("¿Salir de este equipo?")) return;
     leave.disabled = true;
     try {
       await leavePersistentTeam(leave.dataset.team);
       message.textContent = "Has salido del equipo.";
       await load();
     } catch (error) {
       message.textContent = error.message || "No se ha podido salir del equipo.";
       leave.disabled = false;
     }
     return;
   }

   var editForm = event.target.closest(".team-edit-form");
   if (editForm) {
     event.preventDefault();
     var editCard = editForm.closest(".team-card");
     var editButton = editForm.querySelector("button");
     var editStatus = editForm.querySelector(".edit-team-status");
     editButton.disabled = true;
     editStatus.textContent = "Guardando…";
     try {
       await updatePersistentTeam(editCard.dataset.team, editForm.querySelector(".edit-team-name").value, editForm.querySelector(".edit-team-description").value);
       message.textContent = "Equipo actualizado.";
       await load();
     } catch (error) {
       editStatus.textContent = error.message || "No se ha podido actualizar el equipo.";
     } finally {
       editButton.disabled = false;
     }
     return;
   }

   var remove = event.target.closest(".remove-member");
    if (remove) {
      if (!confirm("¿Quitar a esta persona del equipo?")) return;
      remove.disabled = true;
      try {
        await removePersistentTeamMember(remove.dataset.team, remove.dataset.user);
        message.textContent = "Miembro eliminado.";
        await load();
      } catch (error) {
        message.textContent = error.message || "No se ha podido quitar al miembro.";
        remove.disabled = false;
      }
      return;
    }

    var cancel = event.target.closest(".cancel-invite");
    if (cancel) {
      if (!confirm("¿Cancelar esta invitación?")) return;
      cancel.disabled = true;
      try {
        await cancelPersistentTeamInvitation(cancel.dataset.invite);
        message.textContent = "Invitación cancelada.";
        await load();
      } catch (error) {
        message.textContent = error.message || "No se ha podido cancelar la invitación.";
        cancel.disabled = false;
      }
      return;
    }

    var person = event.target.closest(".person-result");
    if (person) {
      var card = person.closest(".team-card");
      var status = card.querySelector(".invite-status");
      person.disabled = true;
      status.textContent = "Enviando invitación…";
      try {
        await sendPersistentTeamInvitation(person.dataset.user, card.dataset.team);
        status.textContent = "Invitación enviada.";
        card.querySelector(".person-search").value = "";
        card.querySelector(".people-results").innerHTML = "";
        await load();
      } catch (error) {
        status.textContent = error.message || "No se ha podido enviar la invitación.";
        person.disabled = false;
      }
      return;
    }
  });

  grid.addEventListener("input", function (event) {
    var input = event.target.closest(".person-search");
    if (!input) return;

    clearTimeout(searchTimer);
    var card = input.closest(".team-card");
    var box = card.querySelector(".people-results");
    var status = card.querySelector(".invite-status");
    status.textContent = "";

    searchTimer = setTimeout(async function () {
      var query = input.value.trim();
      if (query.length < 2) {
        box.innerHTML = "";
        return;
      }

      box.innerHTML = '<div class="manage-empty">Buscando…</div>';
      var current = (window.teamManagementData || []).find(function (item) {
        return item.team.team_id === card.dataset.team;
      });
      var memberIds = new Set((current ? current.members : []).map(function (item) { return item.user_id; }));
      var people = await getChatPeople(query);
      var available = (people || []).filter(function (person) {
        return person.id !== user.id && !memberIds.has(person.id);
      });

      box.innerHTML = available.slice(0, 8).map(function (person) {
        return '<button type="button" class="person-result" data-user="' + esc(person.id) + '">' +
          '<strong>' + esc(person.display_name || person.username || "Usuario") + '</strong><small>' +
          (person.username ? "@" + esc(person.username) : "Perfil público") + ' · Invitar</small></button>';
      }).join("") || '<div class="manage-empty">No hay personas disponibles.</div>';
    }, 250);
  });

  await load();
  var menuButton = document.getElementById("menuButton");
  if (menuButton) {
    menuButton.addEventListener("click", function () {
      var nav = document.getElementById("mainNav");
      if (nav) nav.classList.toggle("mobile-open");
    });
  }
}
</script>
</body></html>
