<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis equipos · Curruscos</title><link rel="stylesheet" href="css/style.css"><style>
.teams-page{max-width:980px;margin:0 auto;padding:70px 24px 100px}.teams-head{display:flex;justify-content:space-between;gap:24px;align-items:end}.teams-head h1{font-size:clamp(48px,8vw,82px);line-height:.94;letter-spacing:-.07em;margin:12px 0}.teams-head p{max-width:560px;color:var(--muted);line-height:1.6}.teams-create{margin-top:30px;padding:22px;border:1px solid var(--border);border-radius:22px;background:var(--surface);display:flex;gap:10px}.teams-create input{flex:1}.teams-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.team-card{padding:25px;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-sm)}.team-card h2{margin:8px 0;font-size:25px}.team-card p{color:var(--muted);line-height:1.5}.team-meta{display:flex;gap:16px;color:var(--muted);font-size:12px}.teams-message{min-height:22px;margin:14px 0;color:var(--muted)}@media(max-width:700px){.teams-page{padding:48px 17px 80px}.teams-head{display:block}.teams-create{display:grid}.teams-grid{grid-template-columns:1fr}}
.nav-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--text);color:var(--surface);font-size:8px;font-weight:900;line-height:1;vertical-align:middle}
</style></head>
<body><header class="navbar"><a href="index.html" class="logo">CURRUSCOS.</a><nav id="mainNav"><a href="explorar.html">Explorar</a><a href="mis-eventos.html">Mis eventos</a><a href="crear.html">Crear</a><a href="login.html">Entrar</a></nav><button id="menuButton" class="menu-button" aria-label="Menú">☰</button></header>
<main class="teams-page"><span class="eyebrow">COMUNIDAD</span><div class="teams-head"><div><h1>Mis equipos.</h1><p>Construye identidades que puedan competir contigo en distintos eventos. El equipo conserva sus miembros y puede reutilizarse.</p></div></div>
<form id="teamCreateForm" class="teams-create"><input id="teamName" maxlength="80" placeholder="Nombre del equipo" required><input id="teamDescription" maxlength="300" placeholder="Descripción (opcional)"><button class="button button-primary" type="submit">Crear equipo</button></form><p id="teamsMessage" class="teams-message"></p><section id="teamsGrid" class="teams-grid"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>
document.addEventListener("DOMContentLoaded",async()=>{const grid=document.getElementById("teamsGrid"),message=document.getElementById("teamsMessage"),form=document.getElementById("teamCreateForm"),user=await getCurrentUser();if(!user){message.innerHTML='Necesitas iniciar sesión para gestionar equipos. <a href="login.html">Entrar</a>';form.style.display="none";return;}
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){const teams=await getMyTeams();grid.innerHTML=teams.length?teams.map(t=>'<article class="team-card"><span class="eyebrow">'+esc(t.role==="owner"?"PROPIETARIO":"MIEMBRO")+'</span><h2>'+esc(t.name)+'</h2><p>'+esc(t.description||"Sin descripción.")+'</p><div class="team-meta"><span>'+Number(t.member_count||0)+' miembros</span><span>Equipo persistente</span></div></article>').join(""):'<article class="team-card"><h2>Aún no tienes equipos.</h2><p>Crea el primero y podrás reutilizarlo en tus próximos eventos.</p></article>';}await load();
form.addEventListener("submit",async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;message.textContent="Creando equipo…";try{const id=await createPersistentTeam(document.getElementById("teamName").value,document.getElementById("teamDescription").value);if(!id)throw new Error("No se ha podido crear.");form.reset();message.textContent="Equipo creado.";await load();}catch(err){message.textContent=err.message||"No se ha podido crear el equipo.";}b.disabled=false;});
document.getElementById("menuButton")?.addEventListener("click",()=>document.getElementById("mainNav")?.classList.toggle("mobile-open"));});
</script></body></html>
