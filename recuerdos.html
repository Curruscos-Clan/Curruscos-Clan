<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuerdos | Curruscos Clan</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .memories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .memory-form {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .memory-form.active {
            display: block;
        }

        .memory-form input,
        .memory-form textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .memory-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .memory-form-buttons {
            display: flex;
            gap: 10px;
        }

        .memories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .memory-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .memory-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .memory-content {
            padding: 20px;
        }

        .memory-content h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .memory-description {
            color: #666;
            line-height: 1.5;
        }

        .memory-meta {
            font-size: 13px;
            color: #888;
            margin-top: 15px;
        }

        .delete-memory {
            margin-top: 15px;
            border: none;
            background: #f1f1f1;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty-memories {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header class="site-header">

        <div class="brand">
            <a href="index.html">Curruscos Clan</a>
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="miembros.html">Miembros</a>
            <a href="eventos.html">Eventos</a>
            <a href="viajes.html">Viajes</a>
            <a href="recuerdos.html">Recuerdos</a>
            <a href="historia.html">Historia</a>
        </nav>

    </header>


    <main class="container">

        <div class="memories-header">

            <div>
                <h1>📸 Recuerdos</h1>
                <p>Los momentos que forman la historia del grupo.</p>
            </div>

            <button id="newMemoryButton">
                + Nuevo recuerdo
            </button>

        </div>


        <section id="memoryForm" class="memory-form">

            <h2>Crear recuerdo</h2>

            <label for="memoryTitle">
                Título
            </label>

            <input
                type="text"
                id="memoryTitle"
                placeholder="Ej. Viaje a Santander"
            >


            <label for="memoryDescription">
                Descripción
            </label>

            <textarea
                id="memoryDescription"
                placeholder="Cuenta algo sobre este momento..."
            ></textarea>


            <label for="memoryImage">
                URL de imagen
            </label>

            <input
                type="url"
                id="memoryImage"
                placeholder="https://..."
            >


            <div class="memory-form-buttons">

                <button id="saveMemoryButton">
                    Guardar recuerdo
                </button>

                <button
                    id="cancelMemoryButton"
                    type="button"
                >
                    Cancelar
                </button>

            </div>

        </section>


        <section id="memoriesGrid" class="memories-grid">
        </section>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/recuerdos.js"></script>
</body>

</html>
