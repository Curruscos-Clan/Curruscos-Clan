<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuerdos | Curruscos Clan</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .memories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .memory-form {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .memory-form.active {
            display: block;
        }

        .memory-form input,
        .memory-form textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .memory-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .memory-form-buttons {
            display: flex;
            gap: 10px;
        }

        .memories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .memory-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .memory-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .memory-content {
            padding: 20px;
        }

        .memory-content h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .memory-description {
            color: #666;
            line-height: 1.5;
        }

        .memory-meta {
            font-size: 13px;
            color: #888;
            margin-top: 15px;
        }

        .delete-memory {
            margin-top: 15px;
            border: none;
            background: #f1f1f1;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty-memories {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header class="site-header">

        <div class="brand">
            <a href="index.html">Curruscos Clan</a>
        </div>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="miembros.html">Miembros</a>
            <a href="eventos.html">Eventos</a>
            <a href="recuerdos.html">Recuerdos</a>
            <a href="historia.html">Historia</a>
        </nav>

    </header>


    <main class="container">

        <div class="memories-header">

            <div>
                <h1>📸 Recuerdos</h1>
                <p>Los momentos que forman la historia del grupo.</p>
            </div>

            <button id="newMemoryButton">
                + Nuevo recuerdo
            </button>

        </div>


        <section id="memoryForm" class="memory-form">

            <h2>Crear recuerdo</h2>

            <label for="memoryTitle">
                Título
            </label>

            <input
                type="text"
                id="memoryTitle"
                placeholder="Ej. Viaje a Santander"
            >


            <label for="memoryDescription">
                Descripción
            </label>

            <textarea
                id="memoryDescription"
                placeholder="Cuenta algo sobre este momento..."
            ></textarea>


            <label for="memoryImage">
                URL de imagen
            </label>

            <input
                type="url"
                id="memoryImage"
                placeholder="https://..."
            >


            <div class="memory-form-buttons">

                <button id="saveMemoryButton">
                    Guardar recuerdo
                </button>

                <button
                    id="cancelMemoryButton"
                    type="button"
                >
                    Cancelar
                </button>

            </div>

        </section>


        <section id="memoriesGrid" class="memories-grid">
        </section>

    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>


    <script>

        let memories = [];


        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                const user = await getCurrentUser();

                if (!user) {
                    window.location.href = "login.html";
                    return;
                }

                await loadMemoriesPage();

                setupMemoryForm();

            }
        );


        async function loadMemoriesPage() {

            const grid =
                document.getElementById(
                    "memoriesGrid"
                );

            grid.innerHTML =
                "<p>Cargando recuerdos...</p>";


            memories =
                await getGroupMemories();


            if (!memories.length) {

                grid.innerHTML = `
                    <div class="empty-memories">
                        <h2>Aún no hay recuerdos</h2>
                        <p>
                            Cread el primero y empezad a construir
                            la historia del grupo.
                        </p>
                    </div>
                `;

                return;
            }


            grid.innerHTML = "";


            memories.forEach(
                memory => {

                    const card =
                        document.createElement("article");

                    card.className =
                        "memory-card";


                    const profile =
                        memory.profiles;


                    const creator =
                        profile?.display_name ||
                        profile?.username ||
                        "Miembro del grupo";


                    const image =
                        memory.image_url
                            ? `
                                <img
                                    src="${escapeHtml(memory.image_url)}"
                                    class="memory-image"
                                    alt="${escapeHtml(memory.title)}"
                                >
                              `
                            : "";


                    card.innerHTML = `

                        ${image}

                        <div class="memory-content">

                            <h3>
                                ${escapeHtml(memory.title)}
                            </h3>

                            ${
                                memory.description
                                    ? `
                                        <p class="memory-description">
                                            ${escapeHtml(memory.description)}
                                        </p>
                                      `
                                    : ""
                            }

                            <div class="memory-meta">
                                Publicado por ${escapeHtml(creator)}
                            </div>

                            <button
                                class="delete-memory"
                                data-memory-id="${memory.id}"
                            >
                                Eliminar
                            </button>

                        </div>

                    `;


                    grid.appendChild(card);

                }
            );


            setupDeleteButtons();

        }


        function setupMemoryForm() {

            const newButton =
                document.getElementById(
                    "newMemoryButton"
                );

            const form =
                document.getElementById(
                    "memoryForm"
                );

            const cancelButton =
                document.getElementById(
                    "cancelMemoryButton"
                );

            const saveButton =
                document.getElementById(
                    "saveMemoryButton"
                );


            newButton.addEventListener(
                "click",
                () => {

                    form.classList.add("active");

                    document
                        .getElementById("memoryTitle")
                        .focus();

                }
            );


            cancelButton.addEventListener(
                "click",
                () => {

                    form.classList.remove("active");

                }
            );


            saveButton.addEventListener(
                "click",
                saveMemory
            );

        }


        async function saveMemory() {

            const title =
                document
                    .getElementById("memoryTitle")
                    .value
                    .trim();


            const description =
                document
                    .getElementById("memoryDescription")
                    .value
                    .trim();


            const imageUrl =
                document
                    .getElementById("memoryImage")
                    .value
                    .trim();


            if (!title) {

                alert(
                    "El título del recuerdo es obligatorio."
                );

                return;

            }


            const button =
                document.getElementById(
                    "saveMemoryButton"
                );


            button.disabled = true;

            button.textContent =
                "Guardando...";


            const memory =
                await createGroupMemory({

                    title: title,

                    description: description,

                    image_url: imageUrl

                });


            if (!memory) {

                alert(
                    "No se ha podido guardar el recuerdo."
                );

                button.disabled = false;

                button.textContent =
                    "Guardar recuerdo";

                return;

            }


            document
                .getElementById("memoryTitle")
                .value = "";


            document
                .getElementById("memoryDescription")
                .value = "";


            document
                .getElementById("memoryImage")
                .value = "";


            document
                .getElementById("memoryForm")
                .classList.remove("active");


            button.disabled = false;

            button.textContent =
                "Guardar recuerdo";


            await loadMemoriesPage();

        }


        function setupDeleteButtons() {

            document
                .querySelectorAll(".delete-memory")
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            async () => {

                                const confirmed =
                                    confirm(
                                        "¿Quieres eliminar este recuerdo?"
                                    );


                                if (!confirmed) {
                                    return;
                                }


                                const success =
                                    await deleteGroupMemory(
                                        button.dataset.memoryId
                                    );


                                if (!success) {

                                    alert(
                                        "No se ha podido eliminar el recuerdo."
                                    );

                                    return;

                                }


                                await loadMemoriesPage();

                            }
                        );

                    }
                );

        }


        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

    </script>

</body>

</html>
