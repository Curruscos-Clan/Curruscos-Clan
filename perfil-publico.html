<!DOCTYPE html><html lang="es" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · Curruscos</title><meta name="description" content="Perfil público de un participante de Curruscos."><link rel="stylesheet" href="css/style.css"><style>.pub-profile{max-width:980px;margin:auto;padding:72px 24px 110px}.pub-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:38px}.pub-back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:800}.pub-card{padding:34px;border:1px solid var(--border);border-radius:28px;background:var(--surface);box-shadow:0 18px 60px rgba(0,0,0,.05)}.pub-head{display:flex;align-items:center;gap:20px}.pub-avatar{width:82px;height:82px;border-radius:25px;background:#111;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;flex:none}.pub-head h1{font-size:clamp(40px,6vw,64px);line-height:.92;letter-spacing:-.065em;margin:5px 0 8px}.pub-head p{margin:0;color:var(--muted);font-size:14px}.pub-badge{display:inline-flex;margin-top:12px;padding:6px 9px;border-radius:999px;background:#f0f0ed;color:#555;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.pub-stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:18px}.pub-stat{padding:18px;border:1px solid var(--border);border-radius:18px;background:var(--background)}.pub-stat span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.pub-stat strong{display:block;margin-top:7px;font-size:25px;letter-spacing:-.04em}.pub-record{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.pub-record-item{padding:16px 18px;border-radius:16px;background:var(--background);border:1px solid var(--border)}.pub-record-item span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.pub-record-item strong{display:block;margin-top:5px;font-size:18px}.pub-note{margin:18px 2px 0;color:var(--muted);font-size:12px;line-height:1.55}.pub-empty{padding:70px 20px;text-align:center;color:var(--muted)}@media(max-width:760px){.pub-profile{padding:45px 16px 80px}.pub-top{margin-bottom:25px}.pub-card{padding:24px}.pub-stats{grid-template-columns:repeat(2,1fr)}.pub-record{grid-template-columns:1fr 1fr}.pub-stat:last-child{grid-column:1/-1}.pub-head h1{font-size:42px}}@media(max-width:430px){.pub-head{align-items:flex-start}.pub-avatar{width:64px;height:64px;border-radius:20px;font-size:24px}.pub-record{grid-template-columns:1fr}}.pub-activity-section{margin-top:16px;padding:24px;border:1px solid var(--border);border-radius:24px;background:var(--surface);box-shadow:var(--shadow-sm)}.pub-section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}.pub-section-head h2{margin:4px 0 0;font-size:28px;letter-spacing:-.04em}.pub-section-head>span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.pub-activity-list{display:grid;gap:7px}.pub-activity-item{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 15px;border:1px solid var(--border);border-radius:15px;background:var(--background);color:inherit;text-decoration:none;transition:transform .15s ease,background .15s ease}.pub-activity-item:hover{transform:translateY(-1px);background:var(--surface)}.pub-activity-main{display:grid;gap:4px;min-width:0}.pub-activity-main strong{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pub-activity-main span,.pub-activity-meta{font-size:10px;color:var(--muted)}.pub-activity-meta{display:grid;gap:4px;text-align:right;flex:none}.pub-activity-meta small{font-size:9px;text-transform:uppercase;letter-spacing:.7px}.pub-activity-empty{margin-top:0}@media(max-width:560px){.pub-activity-section{padding:18px}.pub-activity-item{align-items:flex-start}.pub-activity-main strong{white-space:normal}.pub-activity-meta{font-size:9px}}.pub-team-list{display:grid;gap:8px}.pub-team-item{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px;border:1px solid var(--border);border-radius:15px;background:var(--background);color:inherit;text-decoration:none}.pub-team-item>div{display:grid;gap:4px}.pub-team-item strong{font-size:13px}.pub-team-item span,.pub-team-item small{font-size:10px;color:var(--muted)}.pub-team-item small{text-transform:uppercase;letter-spacing:.7px;text-align:right}.pub-team-item:hover{background:var(--surface);transform:translateY(-1px)}.profile-invite-box{margin-top:14px;padding:15px;border:1px solid var(--border);border-radius:18px;background:var(--background)}.profile-invite-row{display:flex;gap:7px;margin-top:8px}.profile-invite-row select{min-width:0;flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)}.profile-invite-box small{display:block;margin-top:7px;color:var(--muted);font-size:9px}@media(max-width:560px){.profile-invite-row{display:grid}.profile-invite-row .button{width:100%}}</style><style>.nav-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--text);color:var(--surface);font-size:8px;font-weight:900;line-height:1;vertical-align:middle}</style><script src="js/i18n.js"></script>

<style id="curruscos-identity-v3">
/* CURRUSCOS IDENTITY SYSTEM — social perception + visual hierarchy */
.pub-profile,.team-page{position:relative;isolation:isolate}
.pub-profile::before,.team-page::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(700px 420px at 12% 8%,rgba(255,255,255,.055),transparent 68%),radial-gradient(620px 420px at 88% 30%,rgba(255,255,255,.035),transparent 70%)}

.pub-card::before,.team-card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);opacity:.7}
.pub-head{align-items:flex-start;position:relative}

.pub-avatar::after{content:"";position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;background:#f5f5f5;border:3px solid #111}
.pub-head h1,.team-head h1{font-weight:950;text-wrap:balance}

.pub-section-head{margin-bottom:18px}
.pub-section-head h2,.team-section h2{font-size:32px;font-weight:900}

.pub-activity-list{position:relative;gap:8px}

.pub-activity-item{position:relative;padding:16px 16px 16px 42px;background:rgba(255,255,255,.018);border-color:rgba(255,255,255,.075)}
.pub-activity-item::before{content:"";position:absolute;left:13px;top:21px;width:10px;height:10px;border-radius:50%;background:#151515;border:2px solid #777;box-shadow:0 0 0 4px #111}
.pub-activity-item:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.16);transform:translateX(3px)}
.pub-team-list{gap:8px}
.pub-team-item{background:rgba(255,255,255,.018);border-color:rgba(255,255,255,.075);transition:transform .18s ease,border-color .18s ease,background .18s ease}
.pub-team-item:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.16);transform:translateX(3px)}
