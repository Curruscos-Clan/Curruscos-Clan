<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil público · Curruscos</title><meta name="description" content="Perfil público de un participante de Curruscos."><link rel="stylesheet" href="css/style.css"><style>.pub-profile{max-width:980px;margin:auto;padding:72px 24px 110px}.pub-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:38px}.pub-back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:800}.pub-card{padding:34px;border:1px solid var(--border);border-radius:28px;background:var(--surface);box-shadow:0 18px 60px rgba(0,0,0,.05)}.pub-head{display:flex;align-items:center;gap:20px}.pub-avatar{width:82px;height:82px;border-radius:25px;background:#111;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;flex:none}.pub-head h1{font-size:clamp(40px,6vw,64px);line-height:.92;letter-spacing:-.065em;margin:5px 0 8px}.pub-head p{margin:0;color:var(--muted);font-size:14px}.pub-badge{display:inline-flex;margin-top:12px;padding:6px 9px;border-radius:999px;background:#f0f0ed;color:#555;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.pub-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}.pub-stat{padding:18px;border:1px solid var(--border);border-radius:18px;background:var(--background)}.pub-stat span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.pub-stat strong{display:block;margin-top:7px;font-size:25px;letter-spacing:-.04em}.pub-record{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.pub-record-item{padding:16px 18px;border-radius:16px;background:var(--background);border:1px solid var(--border)}.pub-record-item span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.pub-record-item strong{display:block;margin-top:5px;font-size:18px}.pub-note{margin:18px 2px 0;color:var(--muted);font-size:12px;line-height:1.55}.pub-empty{padding:70px 20px;text-align:center;color:var(--muted)}@media(max-width:760px){.pub-profile{padding:45px 16px 80px}.pub-top{margin-bottom:25px}.pub-card{padding:24px}.pub-stats{grid-template-columns:repeat(2,1fr)}.pub-record{grid-template-columns:1fr 1fr}.pub-stat:last-child{grid-column:1/-1}.pub-head h1{font-size:42px}}@media(max-width:430px){.pub-head{align-items:flex-start}.pub-avatar{width:64px;height:64px;border-radius:20px;font-size:24px}.pub-record{grid-template-columns:1fr}}</style></head><body><header class="navbar"><a href="index.html" class="logo">CURRUSCOS.</a><nav id="mainNav"><a href="explorar.html">Explorar</a><a href="rankings.html">Rankings</a><a href="crear.html">Crear</a><a href="login.html">Entrar</a></nav><button id="menuButton" class="menu-button" type="button" aria-label="Abrir menú">☰</button></header><main class="pub-profile"><div class="pub-top"><span class="eyebrow">COMUNIDAD</span><a class="pub-back" href="explorar.html">← Volver a explorar</a></div><div id="profileRoot" class="pub-empty">Cargando perfil...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/perfil-publico.js"></script></body></html>
