<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · Curruscos</title><link rel="stylesheet" href="css/style.css"><style>.pub-profile{max-width:850px;margin:auto;padding:75px 24px 100px}.pub-head{display:flex;align-items:center;gap:18px}.pub-avatar{width:78px;height:78px;border-radius:24px;background:#111;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}.pub-head h1{font-size:clamp(38px,6vw,58px);letter-spacing:-.06em;margin:4px 0}.pub-head p{margin:0;color:var(--muted)}.pub-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:30px}.pub-stat{padding:18px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}.pub-stat span{display:block;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.pub-stat strong{display:block;margin-top:7px;font-size:25px}.pub-note{margin-top:14px;color:var(--muted);font-size:12px}.pub-empty{padding:60px;text-align:center;color:var(--muted)}@media(max-width:700px){.pub-profile{padding:50px 16px}.pub-stats{grid-template-columns:repeat(2,1fr)}.pub-stat:last-child{grid-column:1/-1}}</style></head><body><header class="navbar"><a href="index.html" class="logo">CURRUSCOS.</a><nav id="mainNav"><a href="explorar.html">Explorar</a><a href="rankings.html">Rankings</a><a href="crear.html">Crear</a><a href="login.html">Entrar</a></nav><button id="menuButton" class="menu-button">☰</button></header><main class="pub-profile"><div id="profileRoot" class="pub-empty">Cargando perfil...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/perfil-publico.js"></script></body></html>
